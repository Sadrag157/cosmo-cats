openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  description: Contract for the product catalog of the Cosmo Cats Intergalactic Marketplace (Lab 1).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Products
    description: CRUD operations for space goods
paths:
  /api/products:
    get:
      tags:
        - Products
      operationId: listProducts
      summary: List products
      description: Returns a page of products ordered by id. Pagination is offset-based and 0-based.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Number of elements per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Products
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URI of the created product
              schema:
                type: string
                format: uri
                example: http://localhost:8080/api/products/4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Product identifier.
        schema:
          type: integer
          format: int64
          example: 1
    get:
      tags:
        - Products
      operationId: getProduct
      summary: Get a product by id
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Products
      operationId: updateProduct
      summary: Replace a product
      description: Full replacement of the product with the given id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: The updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Products
      operationId: deleteProduct
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: The request is invalid (validation failure, malformed body, or parameter of the wrong type).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            validation:
              summary: Validation failure
              value:
                type: https://cosmo-cats.market/errors/validation
                title: Validation failed
                status: 400
                detail: Field 'price' must be greater than 0.
                instance: /api/products
                errors:
                  - field: price
                    message: must be greater than 0
    NotFound:
      description: The product does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            notFound:
              summary: Unknown product id
              value:
                type: https://cosmo-cats.market/errors/not-found
                title: Product not found
                status: 404
                detail: Product with id 999 was not found.
                instance: /api/products/999
    InternalServerError:
      description: Unexpected server error. The body never contains stack traces or exception messages.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            internal:
              summary: Unexpected failure
              value:
                type: https://cosmo-cats.market/errors/internal
                title: Internal server error
                status: 500
                detail: An unexpected error occurred.
                instance: /api/products
  schemas:
    ProductRequest:
      type: object
      description: Request body for creating (POST) and replacing (PUT) a product.
      required:
        - name
        - price
        - categoryId
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^.*([Ss][Tt][Aa][Rr]|[Gg][Aa][Ll][Aa][Xx][Yy]|[Cc][Oo][Mm][Ee][Tt]|[Cc][Oo][Ss][Mm][Ii][Cc]|[Nn][Ee][Bb][Uu][Ll][Aa]|[Oo][Rr][Bb][Ii][Tt]|[Pp][Ll][Aa][Nn][Ee][Tt]|[Mm][Oo][Oo][Nn]|[Mm][Ee][Tt][Ee][Oo][Rr]|[Aa][Ss][Tt][Ee][Rr][Oo][Ii][Dd]|[Nn][Oo][Vv][Aa]|[Qq][Uu][Aa][Ss][Aa][Rr]|[Gg][Rr][Aa][Vv][Ii][Tt][Yy]|[Ss][Pp][Aa][Cc][Ee]).*$'
          description: Must contain at least one cosmic term (star, galaxy, comet, cosmic, nebula, orbit, planet, moon, meteor, asteroid, nova, quasar, gravity, space), ignoring case.
          example: Anti-Gravity Yarn Ball
        description:
          type: string
          maxLength: 500
          example: A weightless yarn ball that floats around the living room.
        price:
          type: number
          multipleOf: 0.01
          minimum: 0.01
          maximum: 9999999999.99
          description: Price in the marketplace currency with at most two decimal places.
          example: 19.99
        categoryId:
          type: integer
          format: int64
          example: 1
        stock:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: Units in stock. Defaults to 0 when omitted.
          example: 120
    ProductResponse:
      type: object
      required:
        - id
        - name
        - price
        - categoryId
        - stock
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Anti-Gravity Yarn Ball
        description:
          type: string
          maxLength: 500
          nullable: true
          example: A weightless yarn ball that floats around the living room.
        price:
          type: number
          multipleOf: 0.01
          minimum: 0.01
          example: 19.99
        categoryId:
          type: integer
          format: int64
          example: 1
        stock:
          type: integer
          format: int32
          minimum: 0
          example: 120
    ProductPage:
      type: object
      description: Paged envelope. The page number is 0-based.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 3
        totalPages:
          type: integer
          format: int32
          minimum: 0
          example: 1
    ProblemDetail:
      type: object
      description: RFC 9457 problem details.
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          example: Field 'price' must be greater than 0.
        instance:
          type: string
          format: uri-reference
          example: /api/products
        errors:
          type: array
          description: Present for validation errors only.
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: price
        message:
          type: string
          example: must be greater than 0