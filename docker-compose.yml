services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmocats-postgres
    environment:
      POSTGRES_DB: cosmocats
      POSTGRES_USER: cosmocats
      POSTGRES_PASSWORD: cosmocats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: